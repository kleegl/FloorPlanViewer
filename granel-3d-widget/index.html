<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ГК Гранель - 3D Тур</title>
  </head>
  <body>
    <div id="app">
      <!-- Контейнер для 3D -->
      <div id="canvas-container"></div>

      <!-- Лоадер -->
      <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Загрузка 3D-тура...</div>
        <div class="loader-progress">
          <div class="loader-progress-bar" id="progress-bar"></div>
        </div>
        <div class="loader-percent" id="loader-percent">0%</div>
      </div>

      <!-- Верхняя панель с кнопками -->
      <div id="top-bar">
        <div class="view-buttons">
          <button class="view-btn active" data-view="3d">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
            3D-тур
          </button>
          <button class="view-btn" data-view="perspective">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
              <line x1="3" y1="15" x2="21" y2="15" />
              <line x1="9" y1="3" x2="9" y2="21" />
              <line x1="15" y1="3" x2="15" y2="21" />
            </svg>
            Перспектива
          </button>
          <button class="view-btn" data-view="top">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
              <line x1="3" y1="15" x2="21" y2="15" />
              <line x1="9" y1="3" x2="9" y2="21" />
              <line x1="15" y1="3" x2="15" y2="21" />
              <circle cx="12" cy="12" r="2" fill="currentColor" />
            </svg>
            Сверху
          </button>
        </div>

        <button class="toggle-points-btn" id="togglePoints">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <!-- ===== ИНФОРМАЦИЯ О ТЕКУЩЕЙ КОМНАТЕ (СЛЕВА СНИЗУ) ===== -->
      <div id="current-room">
        <div class="room-icon">🏠</div>
        <div class="room-info">
          <div class="room-name">Общий вид</div>
          <div class="room-area">3D-тур</div>
        </div>
      </div>

      <!-- ===== МИНИ-КАРТА (СПРАВА СНИЗУ) ===== -->
      <div id="mini-map" class="mini-map">
        <div class="mini-map-header">
          <span>Схема квартиры</span>
          <button id="expandMapBtn" class="expand-map-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
        </div>
        <div id="mini-map-container">
          <canvas id="miniMapCanvas"></canvas>
        </div>
      </div>

      <!-- ===== ПОЛНОЭКРАННАЯ КАРТА (ОВЕРЛЕЙ) ===== -->
      <div id="fullscreen-map" class="fullscreen-map" style="display: none">
        <div class="fullscreen-map-header">
          <span>Схема квартиры</span>
          <button id="closeMapBtn" class="close-map-btn">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div id="fullscreen-map-container">
          <canvas id="fullscreenMapCanvas"></canvas>
        </div>
      </div>

      <!-- Брендирование -->
      <div id="branding">
        <span class="logo">ГК ГРАНЕЛЬ</span>
      </div>

      <!-- Информация о текущей точке -->
      <div id="point-info" style="display: none">
        <div class="point-info-name"></div>
        <div class="point-info-area"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
